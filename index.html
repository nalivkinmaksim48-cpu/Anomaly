<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anomaly AI</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 95vh; }
        .box { background: #1e1e1e; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
        input, button { padding: 10px; font-size: 14px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; }
        input { width: 65%; }
        button { background: #6366f1; border: none; cursor: pointer; }
        #chat { flex: 1; overflow-y: auto; background: #18181b; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 6px; max-width: 80%; word-break: break-word; }
        .user { background: #4f46e5; align-self: flex-end; }
        .ai { background: #27272a; align-self: flex-start; }
    </style>
</head>
<body>

    <div class="box">
        <input type="text" id="key" placeholder="API Ключ (sk-...)">
        <button onclick="saveKey()">Сохранить ключ</button>
    </div>

    <div id="chat">
        <div class="msg ai">Система готова. Введите ключ вверху и напишите сообщение ниже.</div>
    </div>

    <div class="box" style="display: flex; gap: 10px;">
        <input type="text" id="txt" placeholder="Сообщение..." style="flex:1;" onkeypress="if(event.key==='Enter')send()">
        <button onclick="send()" style="flex:0 0 80px;">Отправить</button>
    </div>

    <script>
        document.getElementById('key').value = localStorage.getItem('k') || '';

        function saveKey() {
            let val = document.getElementById('key').value.trim();
            localStorage.setItem('k', val);
            alert('Сохранено!');
        }

        async function send() {
            let txtIn = document.getElementById('txt');
            let text = txtIn.value.trim();
            if(!text) return;

            let key = localStorage.getItem('k') || document.getElementById('key').value.trim();
            let chat = document.getElementById('chat');

            chat.innerHTML += <div class="msg user">${text}</div>;
            txtIn.value = '';
            chat.scrollTop = chat.scrollHeight;

            if(!key) {
                chat.innerHTML += <div class="msg ai">Ошибка: Введите API-ключ вверху!</div>;
                return;
            }

            chat.innerHTML += <div class="msg ai" id="load">Думаю...</div>`;
            chat.scrollTop = chat.scrollHeight;

            try {
                let res = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
                    body: JSON.stringify({ model: "gpt-4o-mini", messages: [{ role: "user", content: text }] })
                });
                let data = await res.json();
                document.getElementById('load').remove();

if(data.choices) {
                    chat.innerHTML += <div class="msg ai">${data.choices[0].message.content}</div>;
                } else {
                    chat.innerHTML += <div class="msg ai">Ошибка API: проверьте правильность ключа.</div>;
                }
            } catch(e) {
                document.getElementById('load').remove();
                chat.innerHTML += <div class="msg ai">Ошибка сети.</div>;
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
