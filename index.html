```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anomaly AI Client</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #6366f1;
            --text-main: #ffffff;
            --text-sub: #a1a1aa;
            --bubble-user: #4f46e5;
            --bubble-ai: #27272a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Верхняя панель */
        header { background-color: var(--surface-color); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #27272a; }
        .logo { font-weight: bold; font-size: 16px; color: var(--primary-color); display: flex; align-items: center; gap: 8px; }
        .settings-btn { background: none; border: none; color: var(--text-sub); font-size: 18px; cursor: pointer; }

        /* Окно чата */
        .chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.5; word-break: break-word; }
        .message.user { background: var(--bubble-user); align-self: flex-end; border-bottom-right-radius: 4px; }
        .message.ai { background: var(--bubble-ai); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #3f3f46; }

        /* Панель ввода */
        .input-area { background-color: var(--surface-color); padding: 12px 16px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #27272a; }
        .input-area input { flex: 1; background: var(--bg-color); border: 1px solid #3f3f46; padding: 12px 16px; border-radius: 24px; color: var(--text-main); font-size: 14px; outline: none; }
        .input-area input:focus { border-color: var(--primary-color); }
        .send-btn { background: var(--primary-color); border: none; width: 44px; height: 44px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; }

/* Модальное окно настроек API */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: var(--surface-color); padding: 24px; border-radius: 16px; width: 85%; max-width: 320px; display: flex; flex-direction: column; gap: 14px; border: 1px solid #3f3f46; }
        .modal-content h3 { font-size: 16px; }
        .modal-content input { width: 100%; background: var(--bg-color); border: 1px solid #3f3f46; padding: 10px 12px; border-radius: 8px; color: var(--text-main); font-size: 13px; outline: none; }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
        .modal-buttons button { padding: 8px 16px; border-radius: 8px; border: none; font-weight: 500; cursor: pointer; font-size: 13px; }
        .btn-save { background: var(--primary-color); color: white; }
        .btn-cancel { background: transparent; color: var(--text-sub); }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ Anomaly AI</div>
        <button class="settings-btn" onclick="openSettings()">⚙️</button>
    </header>

    <div class="chat-container" id="chat-container">
        <div class="message ai">Привет! Я твой личный ИИ-ассистент. Нажми на шестеренку вверху справа, чтобы указать свой API-ключ, и мы сможем общаться без ограничений!</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Спросите о чем угодно..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <!-- Модальное окно настроек -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>Настройки API</h3>
            <p style="font-size: 12px; color: var(--text-sub);">Введите ваш ключ API (например, OpenAI GPT или совместимый шлюз):</p>
            <input type="password" id="api-key-input" placeholder="sk-...">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeSettings()">Отмена</button>
                <button class="btn-save" onclick="saveSettings()">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('anomaly_api_key') || '';

        function openSettings() {
            document.getElementById('api-key-input').value = apiKey;
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function saveSettings() {
            apiKey = document.getElementById('api-key-input').value.trim();
            localStorage.setItem('anomaly_api_key', apiKey);
            closeSettings();
            alert('API-ключ успешно сохранен на устройстве!');
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if(!text) return;

            const container = document.getElementById('chat-container');
            
            // Сообщение пользователя
            container.innerHTML += <div class="message user">${escapeHtml(text)}</div>;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            // Если ключ не задан, выводим подсказку
            if (!apiKey) {
                setTimeout(() => {
                    container.innerHTML += <div class="message ai">⚠️ Пожалуйста, укажите ваш API-ключ в настройках (иконка шестеренки вверху), чтобы отправлять запросы нейросети.</div>;
                    container.scrollTop = container.scrollHeight;
                }, 400);
                return;
            }

// Индикатор загрузки
            const loadingId = 'loading-' + Date.now();
            container.innerHTML += <div class="message ai" id="${loadingId}">Думаю над ответом...</div>;
            container.scrollTop = container.scrollHeight;

            try {
                // Запрос к реальному API нейросети (OpenAI формат)
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': Bearer ${apiKey}
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [{ role: "user", content: text }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.choices && data.choices.length > 0) {
                    const aiReply = data.choices[0].message.content;
                    container.innerHTML += <div class="message ai">${escapeHtml(aiReply)}</div>;
                } else {
                    container.innerHTML += <div class="message ai">Ошибка ответа сервера: проверьте правильность API-ключа.</div>;
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                container.innerHTML += <div class="message ai">Ошибка соединения с сетью. Проверьте интернет.</div>;
            }

            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
